name: Refresh owner acceptance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  branch-model:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce task to dev and dev to main
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REPO" = "$REPOSITORY"
          if [ "$BASE" = dev ] && [ "$HEAD" != dev ] && [ "$HEAD" != main ]; then exit 0; fi
          if [ "$BASE" = main ] && [ "$HEAD" = dev ]; then exit 0; fi
          echo 'DELIVERY_BRANCH: tasks target dev; only dev releases target main'
          exit 1
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted base code executes with a write-capable token.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate task and release branch routing
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 scripts/delivery.py check-branch "$PR_NUMBER" --status
      - name: Publish the exact-head acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: python3 scripts/delivery.py check-pr "$PR_NUMBER" --status
