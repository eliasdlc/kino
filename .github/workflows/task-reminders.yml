name: Task reminders

# Vercel Hobby only allows one cron run per day, so the reminder job runs from
# GitHub Actions (free on public repos) instead, hitting the same authenticated
# route. Every 15 min so user-set reminder times (remind_at) fire near on-time;
# GitHub cron is best-effort, expect a few minutes of drift.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # allow manual runs for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call task-reminders endpoint
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.usekino.dev/api/cron/task-reminders")
          echo "HTTP $code"
          cat /tmp/body
          test "$code" = "200"
