name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Sin `env:` y sin `secrets:` a propósito. `pnpm test` es lógica pura y
    # las funciones de Convex corren contra `convex-test`, en el proceso. Si
    # algún test empieza a pedir un despliegue o una clave de fuera, este job
    # tiene que fallar en rojo, no ganar una variable aquí.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # La voz del producto. Falla en rojo con la ruta y la línea de cada
      # hallazgo; las excepciones están declaradas dentro del script.
      - run: bash scripts/check-voz.test.sh

      - run: pnpm check:voz

      # El carril único de schema: un PR que toca `convex/schema.ts` no
      # construye mientras haya otro PR abierto, porque todos los previews
      # publican contra el mismo deployment de dev. El token es sólo para
      # listar PRs; los tests siguen sin ver ninguna variable.
      - name: carril de schema
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/carril-de-schema.sh "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.base.sha }}"

      - run: pnpm test

      - run: python3 -m unittest discover -s scripts/tests -v

  bundle:
    name: presupuesto de JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job aparte, y no un paso más de `verify`, para no romper lo que ese job
    # promete: correr sin una sola variable. Medir el bundle exige construir, y
    # construir exige saber a qué deployment de Convex apunta el cliente.
    #
    # `NEXT_PUBLIC_CONVEX_URL` es una variable del repositorio y no un secreto:
    # viaja al navegador en cada despliegue, así que esconderla aquí no
    # escondería nada. Es la única que el build necesita; comprobado quitando
    # todas las demás.
    env:
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Falla en rojo si el JavaScript que se le manda al navegador pasa su
      # tope. Subirlo es una decisión que se escribe en el PR, no un ajuste.
      - run: pnpm check:bundle
