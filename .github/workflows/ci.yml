name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Sin `env:` y sin `secrets:` a propósito. `pnpm test` es lógica pura y
    # las funciones de Convex corren contra `convex-test`, en el proceso. Si
    # algún test empieza a pedir un despliegue o una clave de fuera, este job
    # tiene que fallar en rojo, no ganar una variable aquí.
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
