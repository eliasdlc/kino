# docker-compose.yml
#
# La versión sigue a producción (Neon, Postgres 17). Un cluster creado por una
# versión mayor anterior no lo abre el binario nuevo: al subir de versión hay
# que recrear el volumen con `docker compose down -v`. No se pierde nada, esta
# base es sólo el entorno de aislamiento y `pnpm test:isolation` la deja en
# TRUNCATE de todas formas.
services:
  postgres:
    image: postgres:17-alpine
    container_name: kino-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kino
      POSTGRES_PASSWORD: kino_dev_password
      POSTGRES_DB: kino
    volumes:
      - kino_pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kino -d kino" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kino_pgdata:
