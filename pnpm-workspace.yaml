# pnpm-workspace.yaml
packages:
  # All packages in subdirs of packages/
  - "packages/*"
  # Specifically include a project in the root sub-folder
  - "!**/test/**"
# pnpm >= 10.6 lee overrides desde aquí; el campo "pnpm" de package.json ya no se
# lee en pnpm 11, y la discrepancia con el lockfile rompía el install de Vercel.
overrides:
  kysely: 0.28.17
allowBuilds:
  # Descarga el binario que sube los sourcemaps en el build. Sin él, el día que
  # el token de Sentry entre en Vercel las trazas llegarían minificadas y el
  # motivo no se vería por ninguna parte.
  '@sentry/cli': true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
